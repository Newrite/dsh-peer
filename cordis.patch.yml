# @caelricluo/dsh-peer bundle patch.
# Loaded automatically when this package is listed in `dsh.profile.bundles`
# (added by `dsh plugin --profile <profile> add <spec>`).
#
# The row mounts the cross-harness bridge: it starts the loopback HTTP bridge,
# registers the five model-facing peer tools, and delivers guest messages into
# live DSH sessions. See CONTRACT.md sections 8 and 9.
#
# Kalpa fork defaults: inbound delivery only (no child `claude`/`codex`
# processes), and a guest never cancels or interrupts a live session.
- insert:
    - id: dsh-peer
      name: '@caelricluo/dsh-peer'
      config:
        enabledHarnesses: [dsh]
        liveSession:
          delivery: queue
          cancelOnAbort: false
          # A delegator may attach a session goal (as /goal would) so the lead
          # keeps working round after round instead of stopping after a commit.
          allowGoals: true
